name: Build Beta

on:
  push:
    branches:
      - beta

permissions:
  contents: write   # needed to create/update the beta pre-release

jobs:

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-win-${{ hashFiles('deps/requirements.txt') }}-notorch
          restore-keys: |
            pip-win-${{ hashFiles('deps/requirements.txt') }}-
            pip-win-

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-beta-win-py312-${{ hashFiles('core/**/*.py', 'desktop/**/*.py', 'server/**/*.py', 'cogs/**/*.py') }}
          restore-keys: nuitka-beta-win-py312-

      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r deps/requirements.txt
          pip install nuitka ordered-set zstandard
          # torch/easyocr and PyQt6-WebEngine intentionally excluded on Windows.

      - name: Seed config.json
        shell: pwsh
        run: Copy-Item config.json.example config.json

      - name: Build with Nuitka
        shell: pwsh
        run: |
          $VERSION = git describe --tags --always --dirty
          python -m nuitka `
            --onefile `
            --assume-yes-for-downloads `
            --output-dir=dist `
            --output-filename=mtg-collection-manager-windows-beta `
            "--onefile-tempdir-spec={CACHE_DIR}/mtg-collection-manager/beta" `
            --enable-plugin=pyqt6 `
            --include-qt-plugins=sensible `
            --follow-import-to=core `
            --follow-import-to=core.translations `
            --follow-import-to=desktop `
            --follow-import-to=server `
            --follow-import-to=cogs `
            --include-package=cv2 `
            --include-package=PIL `
            --include-package=discord `
            --include-package=aiohttp `
            --include-package=aiosqlite `
            --include-package=qasync `
            --include-package=matplotlib `
            --include-package=pytesseract `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=_tkinter `
            --nofollow-import-to=tornado `
            --nofollow-import-to=wx `
            --nofollow-import-to=gi `
            --nofollow-import-to=IPython `
            --nofollow-import-to=jupyter `
            --nofollow-import-to=notebook `
            --nofollow-import-to=pytest `
            --nofollow-import-to=setuptools `
            --nofollow-import-to=xmlrpc `
            --nofollow-import-to=ftplib `
            --nofollow-import-to=imaplib `
            --nofollow-import-to=poplib `
            --nofollow-import-to=smtplib `
            --nofollow-import-to=matplotlib.sphinxext `
            --nofollow-import-to=matplotlib.testing `
            "--include-data-dir=images/mana=images/mana" `
            "--include-data-files=config.json=config.json" `
            --standalone `
            --lto=no `
            "--jobs=$env:NUMBER_OF_PROCESSORS" `
            --no-progressbar `
            --python-flag=no_site `
            --windows-console-mode=disable `
            desktop/app.py

      - name: Upload to beta pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "Beta"
          prerelease: true
          body: |
            **Beta build** — latest commit on the `beta` branch.

            Built from: `${{ github.sha }}`
            ${{ github.event.head_commit.message }}

            > ⚠ This is a pre-release for testing only.
          files: dist/mtg-collection-manager-windows-beta.exe


  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ hashFiles('deps/requirements.txt') }}-notorch
          restore-keys: |
            pip-linux-${{ hashFiles('deps/requirements.txt') }}-
            pip-linux-

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-beta-linux-py312-${{ hashFiles('core/**/*.py', 'desktop/**/*.py', 'server/**/*.py', 'cogs/**/*.py') }}
          restore-keys: nuitka-beta-linux-py312-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            tesseract-ocr tesseract-ocr-deu \
            libgl1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxkbcommon-x11-0 \
            patchelf ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deps/requirements.txt
          pip install nuitka ordered-set zstandard
          # torch/easyocr intentionally excluded — Tesseract handles OCR and
          # avoids a ~1 GB download (torch + scipy + scikit-image + shapely cascade).

      - name: Seed config.json
        run: cp config.json.example config.json

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename=mtg-collection-manager-linux-beta \
            "--onefile-tempdir-spec={CACHE_DIR}/mtg-collection-manager/beta" \
            --enable-plugin=pyqt6 \
            --include-qt-plugins=sensible \
            --follow-import-to=core \
            --follow-import-to=core.translations \
            --follow-import-to=desktop \
            --follow-import-to=server \
            --follow-import-to=cogs \
            --include-package=cv2 \
            --include-package=PIL \
            --include-package=discord \
            --include-package=aiohttp \
            --include-package=aiosqlite \
            --include-package=qasync \
            --include-package=matplotlib \
            --include-package=pytesseract \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=_tkinter \
            --nofollow-import-to=tornado \
            --nofollow-import-to=wx \
            --nofollow-import-to=gi \
            --nofollow-import-to=IPython \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=notebook \
            --nofollow-import-to=pytest \
            --nofollow-import-to=setuptools \
            --nofollow-import-to=xmlrpc \
            --nofollow-import-to=ftplib \
            --nofollow-import-to=imaplib \
            --nofollow-import-to=poplib \
            --nofollow-import-to=smtplib \
            --nofollow-import-to=matplotlib.sphinxext \
            --nofollow-import-to=matplotlib.testing \
            "--include-data-dir=images/mana=images/mana" \
            "--include-data-files=config.json=config.json" \
            --standalone \
            --lto=yes \
            --jobs=$(nproc) \
            --no-progressbar \
            --python-flag=no_site \
            desktop/app.py

      - name: Upload to beta pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "Beta"
          prerelease: true
          body: |
            **Beta build** — latest commit on the `beta` branch.

            Built from: `${{ github.sha }}`
            ${{ github.event.head_commit.message }}

            > ⚠ This is a pre-release for testing only.
          files: dist/mtg-collection-manager-linux-beta


  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-${{ hashFiles('deps/requirements.txt') }}-notorch
          restore-keys: |
            pip-macos-${{ hashFiles('deps/requirements.txt') }}-
            pip-macos-

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-beta-macos-py312-${{ hashFiles('core/**/*.py', 'desktop/**/*.py', 'server/**/*.py', 'cogs/**/*.py') }}
          restore-keys: nuitka-beta-macos-py312-

      - name: Install system dependencies
        run: brew install tesseract tesseract-lang ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deps/requirements.txt
          pip install nuitka ordered-set zstandard jsonschema
          # torch/easyocr intentionally excluded — Tesseract handles OCR and
          # avoids a ~1 GB download (torch + scipy + scikit-image + shapely cascade).
          # PyQt6-WebEngine is NOT installed: Nuitka fatally fails to locate the
          # QtWebEngine resources bundle on macOS.  The patch step below handles
          # any residual detection; --nofollow-import-to guards the import side.
          # jsonschema: Nuitka needs it to validate its package config when it
          # detects a PyQt6 checksum mismatch — pre-installing avoids a failed
          # private pip download at build time.

      - name: Patch Nuitka PyQt6-on-macOS checks
        run: |
          python3 - <<'EOF'
          import pathlib, re, site, sys

          for p in site.getsitepackages():
              sitebase = pathlib.Path(p)
              if not (sitebase / "nuitka").exists():
                  continue

              # Patch 1: YAML — downgrade PyQt6 macOS support_info from error to warning
              cfg = sitebase / "nuitka/plugins/standard/standard.nuitka-package.config.yml"
              if cfg.exists():
                  txt = cfg.read_text()
                  new = txt.replace(
                      "support_info: 'error'\n        when: 'macos and use_pyqt6'",
                      "support_info: 'warning'\n        when: 'macos and use_pyqt6'",
                  )
                  if new != txt:
                      cfg.write_text(new)
                      print("Patched YAML:", cfg)
                  else:
                      print("YAML pattern not found (Nuitka may have changed)")

              # Patch 2: Python plugin — WebEngine FATAL → warning + return
              for py_path in (sitebase / "nuitka").rglob("*.py"):
                  txt = py_path.read_text(errors="replace")
                  if "failed to detect QtWebEngine resources path" not in txt:
                      continue
                  new = re.sub(
                      r'([ \t]*)self\.sysexit\("Error, failed to detect QtWebEngine resources path[^"]*"\)',
                      lambda m: (
                          m.group(1) + 'self.warning("QtWebEngine resources not found'
                          ' — WebEngine disabled on macOS")\n'
                          + m.group(1) + 'return'
                      ),
                      txt,
                  )
                  if new != txt:
                      py_path.write_text(new)
                      print("Patched WebEngine FATAL in:", py_path)
                  else:
                      print("WebEngine FATAL pattern not found in:", py_path)
                  break

              sys.exit(0)

          print("ERROR: Nuitka not found in site-packages")
          sys.exit(1)
          EOF

      - name: Seed config.json
        run: cp config.json.example config.json

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename=mtg-collection-manager-macos-beta \
            "--onefile-tempdir-spec={CACHE_DIR}/mtg-collection-manager/beta" \
            --enable-plugin=pyqt6 \
            --include-qt-plugins=sensible \
            --follow-import-to=core \
            --follow-import-to=core.translations \
            --follow-import-to=desktop \
            --follow-import-to=server \
            --follow-import-to=cogs \
            --include-package=cv2 \
            --include-package=PIL \
            --include-package=discord \
            --include-package=aiohttp \
            --include-package=aiosqlite \
            --include-package=qasync \
            --include-package=matplotlib \
            --include-package=pytesseract \
            --nofollow-import-to=PyQt6.QtWebEngineCore \
            --nofollow-import-to=PyQt6.QtWebEngineWidgets \
            --nofollow-import-to=PyQt6.QtWebEngineQuick \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=_tkinter \
            --nofollow-import-to=tornado \
            --nofollow-import-to=wx \
            --nofollow-import-to=gi \
            --nofollow-import-to=IPython \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=notebook \
            --nofollow-import-to=pytest \
            --nofollow-import-to=setuptools \
            --nofollow-import-to=xmlrpc \
            --nofollow-import-to=ftplib \
            --nofollow-import-to=imaplib \
            --nofollow-import-to=poplib \
            --nofollow-import-to=smtplib \
            --nofollow-import-to=matplotlib.sphinxext \
            --nofollow-import-to=matplotlib.testing \
            "--include-data-dir=images/mana=images/mana" \
            "--include-data-files=config.json=config.json" \
            --standalone \
            --lto=yes \
            --jobs=$(sysctl -n hw.logicalcpu) \
            --no-progressbar \
            --python-flag=no_site \
            desktop/app.py

      - name: Upload to beta pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "Beta"
          prerelease: true
          body: |
            **Beta build** — latest commit on the `beta` branch.

            Built from: `${{ github.sha }}`
            ${{ github.event.head_commit.message }}

            > ⚠ This is a pre-release for testing only.
          files: dist/mtg-collection-manager-macos-beta
