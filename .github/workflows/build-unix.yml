name: Build Linux & macOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to upload release assets

jobs:

  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ hashFiles('deps/requirements.txt') }}-torch-cpu
          restore-keys: |
            pip-linux-${{ hashFiles('deps/requirements.txt') }}-
            pip-linux-

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-py312-${{ hashFiles('core/**/*.py', 'desktop/**/*.py', 'server/**/*.py', 'cogs/**/*.py') }}
          restore-keys: nuitka-linux-py312-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            tesseract-ocr tesseract-ocr-deu \
            libgl1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxkbcommon-x11-0 \
            patchelf ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r deps/requirements.txt
          pip install nuitka ordered-set zstandard
          pip install PyQt6-WebEngine

      - name: Seed config.json
        run: cp config.json.example config.json

      - name: Build with Nuitka
        run: |
          VERSION=$(git describe --tags --always)
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename=mtg-collection-manager-linux \
            "--onefile-tempdir-spec={CACHE_DIR}/mtg-collection-manager/$VERSION" \
            --enable-plugin=pyqt6 \
            --include-qt-plugins=sensible \
            --follow-import-to=core \
            --follow-import-to=desktop \
            --follow-import-to=server \
            --follow-import-to=cogs \
            --include-package=easyocr \
            --include-package=cv2 \
            --include-package=torch \
            --include-package=PIL \
            --include-package=PyQt6.QtWebEngineCore \
            --include-package=PyQt6.QtWebEngineWidgets \
            --include-package=discord \
            --include-package=aiohttp \
            --include-package=aiosqlite \
            --include-package=qasync \
            --include-package=matplotlib \
            --include-package=fastapi \
            --include-package=uvicorn \
            --include-package=starlette \
            --include-package=pytesseract \
            --include-package=anyio \
            --include-package=scipy \
            --nofollow-import-to=torch.cuda \
            --nofollow-import-to=torch.backends.cuda \
            --nofollow-import-to=torch.backends.cudnn \
            --nofollow-import-to=torch.utils.tensorboard \
            --nofollow-import-to=torch.distributed \
            --nofollow-import-to=torch.optim \
            --nofollow-import-to=torch.ao \
            --nofollow-import-to=torch.jit \
            --nofollow-import-to=torch.onnx \
            --nofollow-import-to=torch.export \
            --nofollow-import-to=torch.testing \
            --nofollow-import-to=torchaudio \
            --nofollow-import-to=torchvision.models \
            --nofollow-import-to=triton \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=_tkinter \
            --nofollow-import-to=tornado \
            --nofollow-import-to=wx \
            --nofollow-import-to=gi \
            --nofollow-import-to=IPython \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=notebook \
            --nofollow-import-to=pytest \
            --nofollow-import-to=setuptools \
            --nofollow-import-to=xmlrpc \
            --nofollow-import-to=ftplib \
            --nofollow-import-to=imaplib \
            --nofollow-import-to=poplib \
            --nofollow-import-to=smtplib \
            --nofollow-import-to=matplotlib.sphinxext \
            --nofollow-import-to=matplotlib.testing \
            --nofollow-import-to=sympy \
            --nofollow-import-to=scipy._lib.tests \
            --nofollow-import-to=scipy.cluster.tests \
            --nofollow-import-to=scipy.constants.tests \
            --nofollow-import-to=scipy.datasets.tests \
            --nofollow-import-to=scipy.differentiate.tests \
            --nofollow-import-to=scipy.fft._pocketfft.tests \
            --nofollow-import-to=scipy.fft.tests \
            --nofollow-import-to=scipy.fftpack.tests \
            --nofollow-import-to=scipy.integrate._ivp.tests \
            --nofollow-import-to=scipy.integrate.tests \
            --nofollow-import-to=scipy.interpolate.tests \
            --nofollow-import-to=scipy.io._harwell_boeing.tests \
            --nofollow-import-to=scipy.io.arff.tests \
            --nofollow-import-to=scipy.io.matlab.tests \
            --nofollow-import-to=scipy.io.tests \
            --nofollow-import-to=scipy.linalg.tests \
            --nofollow-import-to=scipy.ndimage.tests \
            --nofollow-import-to=scipy.odr.tests \
            --nofollow-import-to=scipy.optimize._trustregion_constr.tests \
            --nofollow-import-to=scipy.optimize.tests \
            --nofollow-import-to=scipy.signal.tests \
            --nofollow-import-to=scipy.sparse.csgraph.tests \
            --nofollow-import-to=scipy.sparse.linalg._dsolve.tests \
            --nofollow-import-to=scipy.sparse.linalg._eigen.arpack.tests \
            --nofollow-import-to=scipy.sparse.linalg._eigen.lobpcg.tests \
            --nofollow-import-to=scipy.sparse.linalg._eigen.tests \
            --nofollow-import-to=scipy.sparse.linalg._isolve.tests \
            --nofollow-import-to=scipy.sparse.linalg.tests \
            --nofollow-import-to=scipy.sparse.tests \
            --nofollow-import-to=scipy.spatial.tests \
            --nofollow-import-to=scipy.spatial.transform.tests \
            --nofollow-import-to=scipy.special.tests \
            --nofollow-import-to=scipy.stats.tests \
            "--include-data-dir=images/mana=images/mana" \
            "--include-data-dir=server/ui/templates=server/ui/templates" \
            "--include-data-dir=server/ui/static=server/ui/static" \
            "--include-data-files=config.json=config.json" \
            --standalone \
            --lto=yes \
            --jobs=$(nproc) \
            --no-progressbar \
            --python-flag=no_site \
            desktop/app.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mtg-collection-manager-linux
          tag_name: ${{ github.ref_name }}


  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-${{ hashFiles('deps/requirements.txt') }}-torch-cpu
          restore-keys: |
            pip-macos-${{ hashFiles('deps/requirements.txt') }}-
            pip-macos-

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-py312-${{ hashFiles('core/**/*.py', 'desktop/**/*.py', 'server/**/*.py', 'cogs/**/*.py') }}
          restore-keys: nuitka-macos-py312-

      - name: Install system dependencies
        run: brew install tesseract tesseract-lang ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r deps/requirements.txt
          pip install nuitka ordered-set zstandard
          # PyQt6-WebEngine is NOT installed: Nuitka fatally fails to locate the
          # QtWebEngine resources bundle on macOS.  JsRenderer.available() returns
          # False at runtime and all JS-rendering UI falls back gracefully.

      # Nuitka marks PyQt6+macOS as a fatal error in its package config, and the
      # Python plugin code also fatally exits when it finds Qt WebEngine dylibs in
      # the Qt framework but can't locate the resources bundle (which only ships
      # with the PyQt6-WebEngine pip package, intentionally not installed here).
      # Patch 1: YAML — downgrade support_info from 'error' to 'warning'.
      # Patch 2: Python plugin — convert the WebEngine resources sysexit to a
      #          warning + early return so the build continues without WebEngine.
      - name: Patch Nuitka PyQt6-on-macOS checks
        run: |
          python3 - <<'EOF'
          import pathlib, re, site, sys

          for p in site.getsitepackages():
              sitebase = pathlib.Path(p)
              if not (sitebase / "nuitka").exists():
                  continue

              # ── Patch 1: YAML ──────────────────────────────────────────────
              cfg = sitebase / "nuitka/plugins/standard/standard.nuitka-package.config.yml"
              if cfg.exists():
                  txt = cfg.read_text()
                  new = txt.replace(
                      "support_info: 'error'\n        when: 'macos and use_pyqt6'",
                      "support_info: 'warning'\n        when: 'macos and use_pyqt6'",
                  )
                  if new != txt:
                      cfg.write_text(new)
                      print("Patched YAML:", cfg)
                  else:
                      print("YAML pattern not found (Nuitka may have changed)")

              # ── Patch 2: Python plugin — WebEngine FATAL → warning + return ─
              for py_path in (sitebase / "nuitka").rglob("*.py"):
                  txt = py_path.read_text(errors="replace")
                  if "failed to detect QtWebEngine resources path" not in txt:
                      continue
                  new = re.sub(
                      r'([ \t]*)self\.sysexit\("Error, failed to detect QtWebEngine resources path[^"]*"\)',
                      lambda m: (
                          m.group(1) + 'self.warning("QtWebEngine resources not found'
                          ' — WebEngine disabled on macOS")\n'
                          + m.group(1) + 'return'
                      ),
                      txt,
                  )
                  if new != txt:
                      py_path.write_text(new)
                      print("Patched WebEngine FATAL in:", py_path)
                  else:
                      print("WebEngine FATAL pattern not found in:", py_path)
                  break

              sys.exit(0)

          print("ERROR: Nuitka not found in site-packages")
          sys.exit(1)
          EOF

      - name: Seed config.json
        run: cp config.json.example config.json

      - name: Build with Nuitka
        run: |
          VERSION=$(git describe --tags --always)
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename=mtg-collection-manager-macos \
            "--onefile-tempdir-spec={CACHE_DIR}/mtg-collection-manager/$VERSION" \
            --enable-plugin=pyqt6 \
            --include-qt-plugins=sensible \
            --follow-import-to=core \
            --follow-import-to=desktop \
            --follow-import-to=server \
            --follow-import-to=cogs \
            --include-package=easyocr \
            --include-package=cv2 \
            --include-package=torch \
            --include-package=PIL \
            --include-package=discord \
            --include-package=aiohttp \
            --include-package=aiosqlite \
            --include-package=qasync \
            --include-package=matplotlib \
            --include-package=fastapi \
            --include-package=uvicorn \
            --include-package=starlette \
            --include-package=pytesseract \
            --include-package=anyio \
            --include-package=scipy \
            --nofollow-import-to=PyQt6.QtWebEngineCore \
            --nofollow-import-to=PyQt6.QtWebEngineWidgets \
            --nofollow-import-to=PyQt6.QtWebEngineQuick \
            --nofollow-import-to=torch.cuda \
            --nofollow-import-to=torch.backends.cuda \
            --nofollow-import-to=torch.backends.cudnn \
            --nofollow-import-to=torch.utils.tensorboard \
            --nofollow-import-to=torch.distributed \
            --nofollow-import-to=torch.optim \
            --nofollow-import-to=torch.ao \
            --nofollow-import-to=torch.jit \
            --nofollow-import-to=torch.onnx \
            --nofollow-import-to=torch.export \
            --nofollow-import-to=torch.testing \
            --nofollow-import-to=torchaudio \
            --nofollow-import-to=torchvision.models \
            --nofollow-import-to=triton \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=_tkinter \
            --nofollow-import-to=tornado \
            --nofollow-import-to=wx \
            --nofollow-import-to=gi \
            --nofollow-import-to=IPython \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=notebook \
            --nofollow-import-to=pytest \
            --nofollow-import-to=setuptools \
            --nofollow-import-to=xmlrpc \
            --nofollow-import-to=ftplib \
            --nofollow-import-to=imaplib \
            --nofollow-import-to=poplib \
            --nofollow-import-to=smtplib \
            --nofollow-import-to=matplotlib.sphinxext \
            --nofollow-import-to=matplotlib.testing \
            --nofollow-import-to=sympy \
            --nofollow-import-to=scipy._lib.tests \
            --nofollow-import-to=scipy.cluster.tests \
            --nofollow-import-to=scipy.constants.tests \
            --nofollow-import-to=scipy.datasets.tests \
            --nofollow-import-to=scipy.differentiate.tests \
            --nofollow-import-to=scipy.fft._pocketfft.tests \
            --nofollow-import-to=scipy.fft.tests \
            --nofollow-import-to=scipy.fftpack.tests \
            --nofollow-import-to=scipy.integrate._ivp.tests \
            --nofollow-import-to=scipy.integrate.tests \
            --nofollow-import-to=scipy.interpolate.tests \
            --nofollow-import-to=scipy.io._harwell_boeing.tests \
            --nofollow-import-to=scipy.io.arff.tests \
            --nofollow-import-to=scipy.io.matlab.tests \
            --nofollow-import-to=scipy.io.tests \
            --nofollow-import-to=scipy.linalg.tests \
            --nofollow-import-to=scipy.ndimage.tests \
