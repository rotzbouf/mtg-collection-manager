name: Build Linux & macOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to upload release assets

jobs:

  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ hashFiles('deps/requirements.txt') }}
          restore-keys: pip-linux-

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-py312-${{ hashFiles('core/**/*.py', 'desktop/**/*.py', 'server/**/*.py', 'cogs/**/*.py') }}
          restore-keys: nuitka-linux-py312-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            tesseract-ocr tesseract-ocr-deu \
            libgl1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxkbcommon-x11-0 \
            patchelf ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deps/requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Seed config.json
        run: cp config.json.example config.json

      - name: Build with Nuitka
        run: |
          VERSION=$(git describe --tags --always)
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename=mtg-collection-manager-linux \
            "--onefile-tempdir-spec={CACHE_DIR}/mtg-collection-manager/$VERSION" \
            --enable-plugin=pyqt6 \
            --include-qt-plugins=sensible \
            --follow-import-to=core \
            --follow-import-to=core.translations \
            --follow-import-to=desktop \
            --follow-import-to=server \
            --follow-import-to=cogs \
            --include-package=cv2 \
            --include-package=PIL \
            --include-package=discord \
            --include-package=aiohttp \
            --include-package=aiosqlite \
            --include-package=qasync \
            --include-package=matplotlib \
            --include-package=pytesseract \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=_tkinter \
            --nofollow-import-to=tornado \
            --nofollow-import-to=wx \
            --nofollow-import-to=gi \
            --nofollow-import-to=IPython \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=notebook \
            --nofollow-import-to=pytest \
            --nofollow-import-to=setuptools \
            --nofollow-import-to=xmlrpc \
            --nofollow-import-to=ftplib \
            --nofollow-import-to=imaplib \
            --nofollow-import-to=poplib \
            --nofollow-import-to=smtplib \
            --nofollow-import-to=matplotlib.sphinxext \
            --nofollow-import-to=matplotlib.testing \
            --nofollow-import-to=sympy \
            "--include-data-dir=images/mana=images/mana" \
            "--include-data-files=images/app_icon.png=images/app_icon.png" \
            "--include-data-files=config.json=config.json" \
            --standalone \
            --lto=yes \
            --jobs=$(nproc) \
            --no-progressbar \
            --python-flag=no_site \
            desktop/app.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mtg-collection-manager-linux
          tag_name: ${{ github.ref_name }}


  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-${{ hashFiles('deps/requirements.txt') }}
          restore-keys: pip-macos-

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-py312-${{ hashFiles('core/**/*.py', 'desktop/**/*.py', 'server/**/*.py', 'cogs/**/*.py') }}
          restore-keys: nuitka-macos-py312-

      - name: Install system dependencies
        run: brew install tesseract tesseract-lang ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deps/requirements.txt
          pip install nuitka ordered-set zstandard
          # jsonschema pre-installed to avoid Nuitka PyQt6 config validation failure
          pip install jsonschema

      - name: Patch Nuitka PyQt6-on-macOS fatal check
        run: |
          python3 - <<'EOF'
          import pathlib, site, sys
          for p in site.getsitepackages():
              cfg = pathlib.Path(p) / "nuitka/plugins/standard/standard.nuitka-package.config.yml"
              if cfg.exists():
                  txt = cfg.read_text()
                  new = txt.replace(
                      "support_info: 'error'\n        when: 'macos and use_pyqt6'",
                      "support_info: 'warning'\n        when: 'macos and use_pyqt6'",
                  )
                  if new != txt:
                      cfg.write_text(new)
                      print("Patched:", cfg)
                  else:
                      print("Pattern not found in", cfg, "— Nuitka may have changed")
                  sys.exit(0)
          print("ERROR: Nuitka config not found")
          sys.exit(1)
          EOF

      - name: Seed config.json
        run: cp config.json.example config.json

      - name: Build with Nuitka
        run: |
          VERSION=$(git describe --tags --always)
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename=mtg-collection-manager-macos \
            "--onefile-tempdir-spec={CACHE_DIR}/mtg-collection-manager/$VERSION" \
            --enable-plugin=pyqt6 \
            --include-qt-plugins=sensible \
            --follow-import-to=core \
            --follow-import-to=core.translations \
            --follow-import-to=desktop \
            --follow-import-to=server \
            --follow-import-to=cogs \
            --include-package=cv2 \
            --include-package=PIL \
            --include-package=discord \
            --include-package=aiohttp \
            --include-package=aiosqlite \
            --include-package=qasync \
            --include-package=matplotlib \
            --include-package=pytesseract \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=_tkinter \
            --nofollow-import-to=tornado \
            --nofollow-import-to=wx \
            --nofollow-import-to=gi \
            --nofollow-import-to=IPython \
            --nofollow-import-to=jupyter \
            --nofollow-import-to=notebook \
            --nofollow-import-to=pytest \
            --nofollow-import-to=setuptools \
            --nofollow-import-to=xmlrpc \
            --nofollow-import-to=ftplib \
            --nofollow-import-to=imaplib \
            --nofollow-import-to=poplib \
            --nofollow-import-to=smtplib \
            --nofollow-import-to=matplotlib.sphinxext \
            --nofollow-import-to=matplotlib.testing \
            --nofollow-import-to=sympy \
            "--include-data-dir=images/mana=images/mana" \
            "--include-data-files=images/app_icon.png=images/app_icon.png" \
            "--include-data-files=config.json=config.json" \
            --standalone \
            --lto=yes \
            --jobs=$(sysctl -n hw.logicalcpu) \
            --no-progressbar \
            --python-flag=no_site \
            desktop/app.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mtg-collection-manager-macos
          tag_name: ${{ github.ref_name }}
