name: Build Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to upload release assets

jobs:

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-win-${{ hashFiles('deps/requirements.txt') }}
          restore-keys: pip-win-

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-win-py312-${{ hashFiles('core/**/*.py', 'desktop/**/*.py', 'server/**/*.py', 'cogs/**/*.py') }}
          restore-keys: nuitka-win-py312-

      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r deps/requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Seed config.json
        shell: pwsh
        run: Copy-Item config.json.example config.json

      - name: Build with Nuitka
        shell: pwsh
        run: |
          $VERSION = git describe --tags --always
          python -m nuitka `
            --onefile `
            --assume-yes-for-downloads `
            --output-dir=dist `
            --output-filename=mtg-collection-manager-windows `
            "--onefile-tempdir-spec={CACHE_DIR}/mtg-collection-manager/$VERSION" `
            --enable-plugin=pyqt6 `
            --include-qt-plugins=sensible `
            --follow-import-to=core `
            --follow-import-to=core.translations `
            --follow-import-to=desktop `
            --follow-import-to=server `
            --follow-import-to=cogs `
            --include-package=cv2 `
            --include-package=PIL `
            --include-package=discord `
            --include-package=aiohttp `
            --include-package=aiosqlite `
            --include-package=qasync `
            --include-package=matplotlib `
            --include-package=pytesseract `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=_tkinter `
            --nofollow-import-to=tornado `
            --nofollow-import-to=wx `
            --nofollow-import-to=gi `
            --nofollow-import-to=IPython `
            --nofollow-import-to=jupyter `
            --nofollow-import-to=notebook `
            --nofollow-import-to=pytest `
            --nofollow-import-to=setuptools `
            --nofollow-import-to=xmlrpc `
            --nofollow-import-to=ftplib `
            --nofollow-import-to=imaplib `
            --nofollow-import-to=poplib `
            --nofollow-import-to=smtplib `
            --nofollow-import-to=matplotlib.sphinxext `
            --nofollow-import-to=matplotlib.testing `
            --nofollow-import-to=sympy `
            "--include-data-dir=images/mana=images/mana" `
            "--include-data-files=config.json=config.json" `
            --standalone `
            --lto=no `
            "--jobs=$env:NUMBER_OF_PROCESSORS" `
            --no-progressbar `
            --python-flag=no_site `
            --windows-console-mode=disable `
            --windows-icon-from-ico=images/app_icon.ico `
            desktop/app.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mtg-collection-manager-windows.exe
          tag_name: ${{ github.ref_name }}
