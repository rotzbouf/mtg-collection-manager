<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MTG Collection{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2" defer></script>
  <link rel="stylesheet" href="/static/app.css">
  <script>
    // Apply saved/system theme before paint to avoid flash
    (function () {
      var t = localStorage.getItem('theme') ||
              (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="container-fluid">
    <nav>
      <ul>
        <li>
          <strong><a href="/collection" class="contrast brand">
            🃏 MTG Collection
          </a></strong>
        </li>
      </ul>
      <ul>
        <li><a href="/collection" class="nav-link">Collection</a></li>
        <li><a href="/containers" class="nav-link">Containers</a></li>
        <li><a href="/stats" class="nav-link">Stats</a></li>
        <li><a href="/sets" class="nav-link">Sets</a></li>
        <li><a href="/trade" class="nav-link">Trade</a></li>
        <li><a href="/import-export" class="nav-link">Import/Export</a></li>
        <li>
          <a href="#" id="theme-toggle" onclick="toggleTheme(event)" title="Toggle theme" class="theme-btn">🌙</a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="container-fluid">
    <small>MTG Collection Manager <span class="version-tag">v{{ app_version }}</span> — local web UI</small>
  </footer>

  <script>
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
      var btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    function toggleTheme(e) {
      e.preventDefault();
      setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
    // Sync toggle icon on load
    (function () {
      var t = document.documentElement.getAttribute('data-theme') || 'light';
      var btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
    })();

    // Active nav link
    document.querySelectorAll('.nav-link').forEach(function (a) {
      if (window.location.pathname.startsWith(a.getAttribute('href'))) {
        a.setAttribute('aria-current', 'page');
      }
    });
  </script>
</body>
</html>
